name: Publish to ClawHub

# Pushing a tag to GitHub does not update the ClawHub listing on its own.
# This workflow is the only thing that turns a vX.Y.Z tag into a published version.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  # Publishing is an external side effect: queue per tag, never cancel a run mid-publish.
  group: publish-clawhub-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SKILL_PATH: skills/handoff-installer
  SKILL_SLUG: agent-handoff-skill
  SKILL_NAME: Handoff
  MANIFEST_PATH: .codex-plugin/plugin.json
  # ClawHub silently drops hidden paths and symlinks from a published bundle.
  # A wrong file count is the only signal that the payload was truncated.
  EXPECTED_FILE_COUNT: 12
  VERSION_API: https://clawhub.ai/api/v1/skills/agent-handoff-skill/versions
  # Promotion to the public version API is asynchronous on ClawHub's side and
  # has been observed to take far longer than the publish call itself.
  CONFIRM_ATTEMPTS: 10
  CONFIRM_INTERVAL: 30

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          # Without these the annotated tag object is not fetched and the
          # changelog silently falls back to "Release <version>".
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Require agreement between tag, skill and manifest
        run: |
          set -eu
          tag=$GITHUB_REF_NAME
          printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            printf 'tag %s is not vX.Y.Z\n' "$tag" >&2
            exit 1
          }
          version=${tag#v}
          skill_version=$(tr -d '\r\n' < "$SKILL_PATH/VERSION")
          manifest_version=$(jq -r '.version' "$MANIFEST_PATH")
          [ "$skill_version" = "$version" ] || {
            printf 'skill VERSION %s does not match tag %s\n' "$skill_version" "$tag" >&2
            exit 1
          }
          [ "$manifest_version" = "$version" ] || {
            printf 'manifest version %s does not match tag %s\n' "$manifest_version" "$tag" >&2
            exit 1
          }
          # actions/checkout re-points refs/tags/<tag> at the commit sha, which
          # degrades an annotated tag to a lightweight one and silently turns the
          # changelog into the commit subject. Fetch the real tag object back.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" >/dev/null 2>&1 || true
          changelog=$(git tag -l --format='%(contents:subject)' "$tag" || true)
          [ -n "$changelog" ] || changelog="Release $version"
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'CHANGELOG=%s\n' "$changelog" >> "$GITHUB_ENV"

      - name: Log in to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -eu
          [ -n "${CLAWHUB_TOKEN:-}" ] || {
            printf 'CLAWHUB_TOKEN secret is not configured\n' >&2
            exit 1
          }
          npx --yes clawhub@latest login --token "$CLAWHUB_TOKEN" >/dev/null
          npx --yes clawhub@latest whoami

      - name: Dry-run gate
        run: |
          set -eu
          npx --yes clawhub@latest skill publish "$SKILL_PATH" \
            --slug "$SKILL_SLUG" --name "$SKILL_NAME" \
            --version "$VERSION" --changelog "$CHANGELOG" \
            --dry-run --json > dry-run.json || {
            # Keep the CLI's JSON body in the log: it carries the server
            # message and attempt id needed to decide what to do next.
            cat dry-run.json
            exit 1
          }
          cat dry-run.json
          jq -e --arg v "$VERSION" --argjson n "$EXPECTED_FILE_COUNT" \
            '.status == "would-publish" and .version == $v and .fileCount == $n' \
            dry-run.json > /dev/null || {
            printf 'dry-run did not report would-publish for %s with %s files\n' \
              "$VERSION" "$EXPECTED_FILE_COUNT" >&2
            exit 1
          }

      - name: Publish
        run: |
          set -eu
          # Run exactly once. A retry here would create a second attempt for a
          # version the registry may already have accepted.
          npx --yes clawhub@latest skill publish "$SKILL_PATH" \
            --slug "$SKILL_SLUG" --name "$SKILL_NAME" \
            --version "$VERSION" --changelog "$CHANGELOG" \
            --json > publish.json || {
            # Keep the CLI's JSON body in the log: it carries the server
            # message and attempt id needed to decide what to do next.
            cat publish.json
            exit 1
          }
          cat publish.json
          jq -e '.status == "pending-publication" or .status == "published"' \
            publish.json > /dev/null || {
            printf 'publish returned an unrecognised status; check publish.json before retrying\n' >&2
            exit 1
          }

      - name: Confirm the exact version is public
        run: |
          set -eu
          # pending-publication means accepted, not live. Wait for the version API
          # instead of publishing again.
          attempt=0
          while [ "$attempt" -lt "$CONFIRM_ATTEMPTS" ]; do
            attempt=$((attempt + 1))
            code=$(curl -sS -L -o version.json -w '%{http_code}' \
              "$VERSION_API/$VERSION" 2>/dev/null || echo 000)
            if [ "$code" = 200 ] &&
               jq -e --arg v "$VERSION" '.version.version == $v' \
                 version.json > /dev/null 2>&1; then
              # ClawHub adds generated files (skill-card.md) to a published
              # version, so its file count is larger than what we uploaded.
              # Compare paths instead: every uploaded path must be present.
              jq -r '.version.files[].path' version.json | sort > published.txt
              ( cd "$SKILL_PATH" && find . -type f | sed 's|^\./||' ) \
                | sort > uploaded.txt
              missing=$(comm -23 uploaded.txt published.txt)
              if [ -z "$missing" ]; then
                printf '%s is public with all %s uploaded files\n' \
                  "$VERSION" "$EXPECTED_FILE_COUNT"
                exit 0
              fi
              printf 'published %s is missing uploaded files:\n%s\n' \
                "$VERSION" "$missing" >&2
              exit 1
            fi
            # A version that is accepted but not yet promoted answers 404 with a
            # plain-text body; report the code instead of letting jq choke on it.
            printf 'attempt %s/%s: not public yet (HTTP %s)\n' \
              "$attempt" "$CONFIRM_ATTEMPTS" "$code"
            sleep "$CONFIRM_INTERVAL"
          done
          # Measured promotion delay: 0.1.6 took over 15 minutes and 0.1.5 over
          # 50. Publication was already accepted above, so a slow promotion is
          # not a release failure; say so loudly instead of going red every time.
          printf '::warning::%s was accepted but is not public yet after %s attempts; verify later with the command in docs/publish/CLAWHUB.md\n' \
            "$VERSION" "$CONFIRM_ATTEMPTS"
          exit 0
